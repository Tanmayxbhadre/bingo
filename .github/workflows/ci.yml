name: CI Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Run Tests & Build Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suites
        run: npm test

      - name: Run Match Simulation
        run: node server/test/simulateMatch.js

      - name: Build Vite Client
        run: npm --workspace=client run build

