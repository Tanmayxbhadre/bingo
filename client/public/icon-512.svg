<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ballGrad512" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <radialGradient id="highlight512" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#072b4d" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="#072b4d" />

  <!-- Main Ball -->
  <circle cx="256" cy="256" r="202" fill="url(#ballGrad512)" stroke="#072b4d" stroke-width="16" filter="url(#shadow512)" />

  <!-- Ball Shine Highlight -->
  <circle cx="256" cy="256" r="202" fill="url(#highlight512)" />

  <!-- White Center Number Disc -->
  <circle cx="256" cy="256" r="112" fill="#ffffff" stroke="#072b4d" stroke-width="12" />

  <!-- Big Number 7 / B -->
  <text x="256" y="298" font-family="'Fredoka', 'Arial Black', sans-serif" font-size="138" font-weight="900" fill="#0b2c4d" text-anchor="middle">7</text>

  <!-- Gold Star Stamp -->
  <text x="380" y="150" font-size="76">⭐</text>
</svg>
