<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <radialGradient id="highlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#072b4d" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="192" height="192" rx="42" fill="#072b4d" />

  <!-- Main Ball -->
  <circle cx="96" cy="96" r="76" fill="url(#ballGrad)" stroke="#072b4d" stroke-width="6" filter="url(#shadow)" />

  <!-- Ball Shine Highlight -->
  <circle cx="96" cy="96" r="76" fill="url(#highlight)" />

  <!-- White Center Number Disc -->
  <circle cx="96" cy="96" r="42" fill="#ffffff" stroke="#072b4d" stroke-width="5" />

  <!-- Big Number 7 / B -->
  <text x="96" y="112" font-family="'Fredoka', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#0b2c4d" text-anchor="middle">7</text>

  <!-- Gold Star Stamp -->
  <text x="144" y="56" font-size="28">⭐</text>
</svg>
